<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Acron Tacho Hub</title>
  <style>
    :root {
      --bg: #101114;
      --panel: #181a20;
      --panel-2: #20232b;
      --border: #2a2d36;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #2563eb;
      --accent-border: #3b82f6;
      --button-secondary: #242731;
      --button-secondary-border: #3f4350;
      --selected: rgba(37, 99, 235, 0.22);
      --danger: #f87171;
      --topbar-height: 56px;
      --sidebar-width: 320px;
    }

    :root[data-theme="light"] {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --border: #d4d4d8;
      --text: #18181b;
      --muted: #52525b;
      --button-secondary: #f4f4f5;
      --button-secondary-border: #d4d4d8;
      --selected: rgba(37, 99, 235, 0.12);
      --danger: #b91c1c;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #topbar {
      box-sizing: border-box;
      height: var(--topbar-height);
      padding: 0 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 20;
    }

    #topbar-left,
    #topbar-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #topbar-left {
      justify-self: start;
    }

    #topbar-actions {
      justify-self: end;
    }

    body.login-active #panel-toggle {
      display: none;
    }

    #panel-toggle {
      flex: 0 0 auto;
    }

    #app-title {
      flex: 0 1 auto;
      min-width: 0;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    #app-shell {
      height: calc(100vh - var(--topbar-height));
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      background: var(--bg);
      transition: grid-template-columns 220ms ease;
    }

    #app-shell.nav-hidden {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    #vehicle-panel {
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translateX(0);
      transition:
        transform 220ms ease,
        opacity 180ms ease,
        border-color 220ms ease;
      will-change: transform, opacity;
    }

    #app-shell.nav-hidden #vehicle-panel {
      border-right-color: transparent;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-100%);
    }

    @media (prefers-reduced-motion: reduce) {
      #app-shell,
      #vehicle-panel {
        transition: none;
      }
    }

    #vehicle-panel-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    #vehicle-search {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 11px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    #vehicle-search:focus {
      border-color: var(--accent-border);
    }

    #vehicle-count {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    #vehicle-list {
      flex: 1 1 auto;
      overflow: auto;
      padding: 6px;
    }

    .vehicle-item {
      width: 100%;
      box-sizing: border-box;
      appearance: none;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: block;
      font: inherit;
      margin: 2px 0;
      padding: 9px 10px;
      text-align: left;
    }

    .vehicle-item:hover,
    .vehicle-item:focus {
      border-color: var(--button-secondary-border);
      background: var(--panel-2);
      outline: none;
    }

    .vehicle-item.selected {
      border-color: var(--accent-border);
      background: var(--selected);
    }

    .vehicle-name {
      display: block;
      font-size: 14px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .vehicle-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #content {
      min-width: 0;
      min-height: 0;
      position: relative;
      background: var(--bg);
    }

    #status {
      box-sizing: border-box;
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      margin: 0;
      padding: 24px;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      white-space: pre-wrap;
      z-index: 2;
    }

    #status.error {
      color: var(--danger);
    }

    #tachohub {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: var(--bg);
    }

    #login-view {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--topbar-height);
      bottom: 0;
      display: none;
      background: var(--bg);
      z-index: 10;
    }

    #login-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .button {
      appearance: none;
      border: 1px solid var(--accent-border);
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 1;
      padding: 9px 12px;
      white-space: nowrap;
    }

    .button.secondary {
      border-color: var(--button-secondary-border);
      background: var(--button-secondary);
      color: var(--text);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <header id="topbar">
    <div id="topbar-left">
      <button class="button secondary" id="panel-toggle" type="button" aria-controls="vehicle-panel" aria-expanded="true"></button>
      <div id="app-title">Acron Tacho Hub</div>
    </div>
    <div id="topbar-actions">
      <button class="button secondary" id="theme-toggle" type="button"></button>
      <button class="button secondary" id="app-reload" type="button"></button>
    </div>
  </header>

  <div id="app-shell">
    <aside id="vehicle-panel">
      <div id="vehicle-panel-header">
        <input id="vehicle-search" type="search" autocomplete="off">
        <div id="vehicle-count"></div>
      </div>
      <div id="vehicle-list" role="listbox"></div>
    </aside>

    <main id="content">
      <div id="status"></div>
      <iframe
        id="tachohub"
        referrerpolicy="no-referrer"
        allow="fullscreen">
      </iframe>
    </main>
  </div>

  <section id="login-view">
    <iframe id="login-frame"></iframe>
  </section>

  <script src="app.js"></script>
</body>
</html>
